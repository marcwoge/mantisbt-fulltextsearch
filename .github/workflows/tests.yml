name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP and language files
        run: |
          rc=0
          for f in $(find FullTextSearch \( -name '*.php' -o -name '*.txt' \)); do
            out=$(php -l "$f") || { echo "$out"; rc=1; }
          done
          if [ $rc -eq 0 ]; then echo "No syntax errors."; fi
          exit $rc
