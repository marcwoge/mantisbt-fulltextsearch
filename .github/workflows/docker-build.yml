name: Docker build

on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '**/*.dockerfile'
      - '**/.dockerignore'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '**/compose*.yml'
      - '**/compose*.yaml'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image and check PHP version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --pull -f docker/Dockerfile -t ci-image docker

      - name: PHP version
        run: docker run --rm --entrypoint php ci-image -v

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
