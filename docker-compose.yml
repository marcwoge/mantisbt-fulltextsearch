# Local MantisBT sandbox for trying out the FullTextSearch plugin.
#
#   cp .env.example .env   # once; then set your own passwords/salt
#   docker compose up -d --build
#   -> MantisBT : http://localhost:8989   (finish the installer once)
#   -> Mailpit  : http://localhost:8025   (catches every outgoing e-mail)
#
# See docker/README.md for the step-by-step walkthrough.

services:
  db:
    image: mariadb:13.0.2
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env (see .env.example)}
      MARIADB_DATABASE: bugtracker
      MARIADB_USER: mantisbt
      MARIADB_PASSWORD: ${MANTIS_DB_PASSWORD:?set MANTIS_DB_PASSWORD in .env (see .env.example)}
    volumes:
      - mantis_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mantis:
    build: ./docker
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Read by docker/config_inc.php via getenv().
      MANTIS_DB_PASSWORD: ${MANTIS_DB_PASSWORD:?set MANTIS_DB_PASSWORD in .env (see .env.example)}
      MANTIS_CRYPTO_MASTER_SALT: ${MANTIS_CRYPTO_MASTER_SALT:?set MANTIS_CRYPTO_MASTER_SALT in .env (see .env.example)}
    ports:
      - "127.0.0.1:8989:80"
    volumes:
      # Mount the plugin straight into MantisBT's plugins directory.
      - ./FullTextSearch:/var/www/html/plugins/FullTextSearch
      # Pre-baked configuration (DB + Mailpit).
      - ./docker/config_inc.php:/var/www/html/config/config_inc.php

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP

volumes:
  mantis_db:
